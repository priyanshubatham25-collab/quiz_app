
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>

    <script src="https://cdn.tailwindcss.com"></script>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

    <style>
       
        .quiz-navbar {
            background: rgba(12, 3, 30, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.35);
        }

        .quiz-logo {
            color: #c084fc;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .quiz-button {
            transition: all 0.3s ease;
        }

        .quiz-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.5);
        }
    </style>
</head>

<body style="background-image: linear-gradient(rgba(25,5,55,0.5), rgba(15,3,35,0.7)), url('https://images.unsplash.com/photo-1511512578047-dfb367046420'); background-size: cover; background-position: center; background-attachment: fixed;">

    <!-- Navbar -->
    <nav class="quiz-navbar">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

            <!-- Logo -->
            <a href="/" class="flex items-center gap-2">
                <span class="text-3xl">🎯</span>
                <span class="quiz-logo text-2xl font-bold">
                    Quiz Game
                </span>
            </a>

            <!-- Navigation -->
            <div class="flex items-center gap-3 sm:gap-4">

                {% if user.is_authenticated %}

                    <!-- Welcome User -->
                    <span class="text-sm font-medium text-purple-100 sm:text-base">
                        Welcome, {{ user.username }} 👋
                    </span>

                    <!-- Logout -->
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="quiz-button rounded-lg bg-purple-600 px-4 py-2 font-semibold text-white hover:bg-purple-500"
                        >
                            Logout
                        </button>
                    </form>

                {% else %}

                    <!-- Login -->
                    <a
                        href="{% url 'login' %}"
                        class="quiz-button rounded-lg border border-purple-500 px-4 py-2 font-semibold text-purple-300 hover:bg-purple-600 hover:text-white"
                    >
                        Login
                    </a>

                    <!-- Register -->
                    <a
                        href="{% url 'register' %}"
                        class="quiz-button rounded-lg bg-purple-600 px-4 py-2 font-semibold text-white hover:bg-purple-500"
                    >
                        Register
                    </a>

                {% endif %}

            </div>
        </div>
    </nav>

    <!-- Django Messages -->
    <div class="mx-auto max-w-7xl px-6 pt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-3 rounded-lg border border-purple-500/30 bg-purple-950/80 px-4 py-3 text-purple-200">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Page Content -->
    <main class="mx-auto max-w-7xl px-6 py-10">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
