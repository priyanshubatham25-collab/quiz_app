<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link href="../static/css/index.css" rel="stylesheet" />
    <script src="../static/js/navbar.js"></script>
    <script src="../static/js/messages.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>


    {% load static %}

    <link rel="stylesheet" href="{% static 'css/register.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
    <link rel="stylesheet" href="{% static 'css/categories.css' %}" />
    <link rel="stylesheet" href="{% static 'css/quiz_start.css' %}" />
    <link rel="stylesheet" href="{% static 'css/result.css' %}" />
    <link rel="stylesheet" href="{% static 'css/attempts.css' %}" />

    <style></style>
  </head>

  <body
    style="
      background-image:
        linear-gradient(rgba(25, 5, 55, 0.5), rgba(15, 3, 35, 0.7)),
        url(&quot;https://images.unsplash.com/photo-1511512578047-dfb367046420&quot;);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    "
  >
    <!-- Navbar -->
    <nav class="quiz-navbar">
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4"
      >
        <!-- Logo -->
        <a href="{% url 'dashboard' %}" class="flex items-center gap-2">
          <span class="text-3xl">🎯</span>
          <span class="quiz-logo text-2xl font-bold text-purple-300"> Quiz Game </span>
        </a>

        <!-- Navigation -->
        <div class="flex items-center gap-3 sm:gap-4">
          {% if user.is_authenticated %}

          <!-- Welcome User -->
          <span class="text-sm font-medium text-purple-100 sm:text-base">
            Welcome, {{ user.username }} 👋
          </span>

          <!-- Logout -->
          <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}

            <button
              type="submit"
              class="quiz-button rounded-lg bg-purple-600 px-4 py-2 font-semibold text-white hover:bg-purple-500"
            >
              Logout
            </button>
          </form>

          {% else %}

          <!-- Login -->
          <!-- Login -->
          <a
            href="{% url 'login' %}"
            class="quiz-button rounded-lg border border-purple-500 px-4 py-2 font-semibold transition-colors {% if request.path == '/accounts/login/' %} bg-purple-600 text-white {% else %} text-purple-300 hover:bg-purple-600 hover:text-white {% endif %}"
          >
            Login
          </a>

          <!-- Register -->
          <a
            href="{% url 'register' %}"
            class="quiz-button rounded-lg border border-purple-500 px-4 py-2 font-semibold transition-colors {% if request.path == '/accounts/register/' %} bg-purple-600 text-white {% else %} text-purple-300 hover:bg-purple-600 hover:text-white {% endif %}"
          >
            Register
          </a>

          {% endif %}
        </div>
      </div>
    </nav>

    <!-- Django Messages -->
    <div class="mx-auto max-w-7xl px-6 pt-4">
      {% if messages %} {% for message in messages %}
      <div class="quiz-alert mb-3 rounded-lg border border-purple-500/30 bg-purple-950/80 px-4 py-3 text-purple-200">
        {{ message }}
      </div>
      {% endfor %} {% endif %}
    </div>

    <!-- Page Content -->
    <main class="mx-auto max-w-7xl px-6 py-10">
      {% block content %} {% endblock %}
    </main>
  </body>
</html>
