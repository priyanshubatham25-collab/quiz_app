<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
  </head>
  <body class="min-h-screen bg-gray-950 text-gray-200 ">
    <nav class="border-b border-gray-800 bg-gray-950 shadow-sm">
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4"
      >
        <h1 class="text-2xl font-bold text-purple-600">Quiz Game</h1>

        
   <div class="text-sm ">
          {% if messages %}
          <ul class="mb-2">
            {% for m in messages %}
            <li class="rounded-lg bg-purple-100 px-4 py-2 text-green-700">
              {{m}}
            </li>
            {% endfor %}
          </ul>
          {% endif %} {% if user.is_authenticated %}
          <span class="font-medium text-gray-700">
            Hello 👋 {{user.username}}
          </span>

          <span class="mx-2 text-gray-400">|</span>

          <a
            href=""
            class=" font-bold text-xl text-purple-600 hover:text-purple-500"
          >
            Logout
          </a>

          {% else %}

          <a
            href="{% url 'login' %}"
            class="font-medium text-xl text-purple-600 hover:text-purple-400"
          >
            Login
          </a>
          

          <span class="mx-2 text-gray-400">|</span>

          <a
            href="{% url 'register' %}"
            class="font-medium  text-xl text-purple-600 hover:text-purple-400"
          >
            register
          </a>

          {% endif %}
        </div>
      </div>
    </nav>

    <main class="mx-auto max-w-7xl px-6 py-10">
      {% block content %} {% endblock %}
    </main>
  </body>
</html>
